# configs/classes.yaml

# List of classes in your dataset
classes:
  - dogs
  - cats
  - food
  - drink
  - room
  - book
  - painting
  - outside
  - car
  - flowers

# Dataset paths (relative to repo root)
images_dir: data/synthetic/images
captions_csv: data/synthetic/captions.csv

# Split file directory
splits_dir: data/splits

# Attack sets (for Membership Inference)
attack_sets:
  member: data/attack_sets/member.txt
  nonmember: data/attack_sets/nonmember.txt

# Random seed for reproducibility
seed: 1337

# Ratios used to generate splits
train_ratio: 0.7
val_ratio: 0.15
test_ratio: 0.15
